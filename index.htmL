<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Message 💜</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e7, #f3d9ff);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      width: 85%;
      max-width: 500px;
      padding: 40px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .heart {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      color: #b83280;
      margin-bottom: 25px;
    }

    p {
      color: #555;
      font-size: 20px;
      line-height: 1.7;
    }

    .love {
      color: #9c27b0;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="heart">💜</div>

    <h1>A Little Reminder</h1>

    <p>
      Just a reminder that
      <span class="love">I love you so much</span>,
      and please take care of yourself, okay?
    </p>

    <p class="love">
      Miss you so much napo 💜
    </p>

    <div class="heart">🌷💜🌷</div>
  </div>

</body>
</html>
